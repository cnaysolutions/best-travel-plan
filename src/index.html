<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title + SEO -->
    <title>Best Holiday Plan | Plan Your Complete Trip Cost in Minutes</title>
    <meta
      name="description"
      content="Get a clear estimate of your full holiday cost — flights, hotels, car rentals, and daily itineraries — using real-time prices. No booking, no commitment, just clarity."
    />
    <meta
      name="keywords"
      content="holiday cost calculator, trip planner, travel cost estimator, flight pricing, hotel search, car rental, travel itinerary, vacation planner, international travel, holiday planning"
    />
    <meta name="author" content="Best Holiday Plan" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.best-travel-plan.cloud/" />

    <!-- Google Fonts: preconnect + preload (moved from CSS @import for performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" />

    <!-- PWA: Manifest + Theme Color -->
    <link rel="manifest" href="/icons/site.webmanifest" />
    <meta name="theme-color" content="#1a2744" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Best Holiday Plan" />

    <!-- Favicons (IMPORTANT: use /icons/...) -->
    <link rel="icon" href="/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Open Graph (Facebook / Instagram / WhatsApp) -->
    <meta property="og:title" content="Best Holiday Plan | Plan Your Complete Trip Cost" />
    <meta
      property="og:description"
      content="Get a clear estimate of your full holiday — flights, hotels, car rentals, and daily expenses — using real-time prices. No booking required."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.best-travel-plan.cloud/" />
    <meta property="og:site_name" content="Best Holiday Plan" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://www.best-travel-plan.cloud/icons/og-image.png" />
    <meta property="og:image:secure_url" content="https://www.best-travel-plan.cloud/icons/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="How much will my holiday really cost? See the full picture before you travel."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Best Holiday Plan | Complete Trip Cost Estimator" />
    <meta
      name="twitter:description"
      content="Plan your holiday with real-time flight, hotel, and car rental pricing. Get clarity before you book."
    />
    <meta name="twitter:image" content="https://www.best-travel-plan.cloud/icons/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="How much will my holiday really cost? See the full picture before you travel."
    />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Best Holiday Plan",
        "url": "https://www.best-travel-plan.cloud/",
        "logo": "https://www.best-travel-plan.cloud/icons/favicon.ico",
        "description": "Premium travel planning platform that helps travelers estimate full holiday costs with pricing transparency.",
        "foundingDate": "2024",
        "sameAs": []
      }
    </script>

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Best Holiday Plan",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Web",
        "description": "Travel cost intelligence platform for planning trips with flight pricing, hotel estimates, car rentals, and daily expenses. Get complete trip cost estimates without booking commitment.",
        "url": "https://www.best-travel-plan.cloud/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Best Holiday Plan",
        "url": "https://www.best-travel-plan.cloud/",
        "description": "Plan your complete holiday cost with pricing for flights, hotels, car rentals, and daily expenses."
      }
    </script>

    <!-- TravelPayouts Affiliate Tracking (kept as-is) -->
    <script data-noptimize="1" data-cfasync="false" data-wpfc-render="false">
      (function () {
        var script = document.createElement("script");
        script.async = 1;
        script.src = "https://emrldco.com/NDkxNjk1.js?t=491695";

      })();

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => {
              console.log('[PWA] Service worker registered, scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('[PWA] Service worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
